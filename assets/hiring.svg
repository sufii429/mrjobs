<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-label="Are you hiring? illustration">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4f6"/>
      <stop offset="1" stop-color="#cde7ec"/>
    </linearGradient>
    <linearGradient id="hmega" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d849e"/>
      <stop offset="1" stop-color="#1d6a80"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="584" height="444" rx="28" fill="url(#hbg)"/>
  <circle cx="520" cy="70" r="46" fill="#2d849e" opacity="0.12"/>
  <circle cx="70" cy="390" r="34" fill="#f5a623" opacity="0.18"/>
  <circle cx="120" cy="80" r="12" fill="#f5a623" opacity="0.35"/>

  <!-- headline -->
  <text x="300" y="72" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1d6a80">ARE YOU</text>
  <text x="300" y="118" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="40" font-weight="bold" fill="#f5a623">HIRING?</text>

  <!-- megaphone -->
  <g transform="translate(300,265) rotate(-12)">
    <path d="M-95,-28 L35,-62 L35,62 L-95,28 Z" fill="url(#hmega)"/>
    <path d="M35,-62 L78,-84 L78,84 L35,62 Z" fill="#f5a623"/>
    <ellipse cx="80" cy="0" rx="10" ry="86" fill="#d98f1f"/>
    <rect x="-108" y="-20" width="16" height="60" rx="8" fill="#1d6a80"/>
    <path d="M-100,40 L-84,40 L-90,96 L-106,96 Z" fill="#1d6a80"/>
    <!-- sound waves -->
    <g stroke="#f5a623" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M112,-44 Q138,0 112,44"/>
      <path d="M140,-62 Q182,0 140,62" opacity="0.65"/>
      <path d="M168,-80 Q226,0 168,80" opacity="0.4"/>
    </g>
  </g>

  <!-- floating job chips -->
  <g font-family="Verdana, Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="middle">
    <g transform="translate(105,215) rotate(-8)">
      <rect x="-52" y="-26" width="104" height="52" rx="26" fill="#ffffff" stroke="#2d849e" stroke-width="3"/>
      <text x="0" y="8" fill="#1d6a80">MR</text>
    </g>
    <g transform="translate(498,225) rotate(8)">
      <rect x="-52" y="-26" width="104" height="52" rx="26" fill="#ffffff" stroke="#2d849e" stroke-width="3"/>
      <text x="0" y="8" fill="#1d6a80">TM</text>
    </g>
    <g transform="translate(150,340) rotate(6)">
      <rect x="-52" y="-26" width="104" height="52" rx="26" fill="#2d849e"/>
      <text x="0" y="8" fill="#ffffff">AM</text>
    </g>
    <g transform="translate(452,348) rotate(-6)">
      <rect x="-72" y="-26" width="144" height="52" rx="26" fill="#f5a623"/>
      <text x="0" y="8" fill="#ffffff" font-size="20">VACANCY</text>
    </g>
  </g>

  <!-- bottom tagline -->
  <text x="300" y="425" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#4a6b72">Reach thousands of pharma jobseekers — free</text>
</svg>
